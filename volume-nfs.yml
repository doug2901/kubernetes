apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfsvolume
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Recycle
  storageClassName: slow
#  mountOptions:
#    - relatime
#    - nfsvers=4.2
  nfs:
    path: /mnt/nfs
    server: 192.168.15.67