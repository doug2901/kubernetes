apiVersion: apps/v1
kind: Deployment
metadata:
  name: thor 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thor 
  template:
    metadata:
      labels:
        app: thor 
    spec:
      containers:
      - name: thor
        image: hashicorp/http-echo
        ports:
        - containerPort: 80
        args:
        - "-text=thor"
---
apiVersion: v1
kind: Service
metadata:
  name: thor   
spec:
  type: ClusterIP
  ports:
  - port: 80
  selector:
    app: thor 