apiVersion: v1
kind: Pod
metadata:
#  namespace: tests
  name: nginx
spec:
  volumes:
    - name: nfs-storage
      persistentVolumeClaim:
        claimName: nfsvolumeclaim
  containers:
  - name: nginx
    image: nginx
    ports:
      - containerPort: 80
        name: "http-server"
    volumeMounts:
    - name: nfs-storage
      mountPath: /var/nfs # The mountpoint inside the container
#  volumes:
#  - name: nfs-vol
#    nfs:
#      server: 192.168.15.67 # IP to our NFS server
#      path: /mnt/nfs # The exported directory
#      readOnly: true