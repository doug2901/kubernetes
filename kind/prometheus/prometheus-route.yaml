---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: prometheus
spec:
  parentRefs:
  - name: istio-gateway
    namespace: istio-system
  hostnames:
  - "prometheus.lab.corp"
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: prometheus-server
      port: 80