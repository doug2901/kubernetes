apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-route
  namespace: kube-system
spec:
  parentRefs:
  - name: istio-gateway
    namespace: istio-system
  hostnames:
  - "k8sdash.lab.corp"
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: headlamp
      port: 80

#kubectl port-forward -n kube-system service/headlamp 8082:80 >/dev/null 2>&1 &