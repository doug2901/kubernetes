#kubectl run apache-bench -i --tty --rm --image=httpd -- ab -n 500000 -c 1000 http://doug.lab.corp/mdc
#https://faun.pub/kubernetes-horizontal-pod-autoscaling-53fb9d0c2396
#https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mdc-app
  namespace: mdc-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mdc-app
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 90
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
      - type: Percent
        value: 30
        periodSeconds: 60 # vai deletar 30% dos pods a cada 60 segs até atingir o minimo de replicas.
      - type: Pods
        value: 2 #To ensure that no more than 2 Pods are removed per minute, you can add a second scale-down policy with a fixed size of 5, and set selectPolicy to minimum. Setting selectPolicy to Min means that the autoscaler chooses the policy that affects the smallest number of Pods
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60 #Ficou 60 segs processamento alto, vai ir escalonando os pods até 100% das replicas
      - type: Pods
        value: 1
        periodSeconds: 15 #Ficou 15 segs processamento alto, sobe um pod a cada 15 seg até atigir o max de replicas
      selectPolicy: Max