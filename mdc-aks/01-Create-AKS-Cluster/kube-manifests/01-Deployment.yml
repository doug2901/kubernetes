apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp1-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp1
  template: 
    metadata:
      name: myapp1-pod
      labels:
        app: myapp1       
    spec:
      containers:
        - name: myapp1-container
          image: iesodias/mdc-api-python:latest
          ports:
            - containerPort: 5000